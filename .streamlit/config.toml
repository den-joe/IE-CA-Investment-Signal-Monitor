# Theme for the analyst dashboard. Streamlit's own light/dark switch stays on;
# only the accent, type and corner radius are set here.
#
# Type: one family, Public Sans (a public-sector design-system face, sober and
# legible at small sizes), loaded from Google Fonts. With no network,
# Streamlit falls back to its default sans-serif.
# A serif heading font (Source Serif 4) was tried; Streamlit 1.65 did not
# apply a second remote font via headingFont, so it was dropped rather than
# forced with custom CSS.

[theme]
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap, sans-serif"
headingFontSizes = ["2rem", "1.5rem", "1.2rem", "1rem", "0.9rem", "0.85rem"]
baseRadius = "small"

# Ink blue on light; a lighter tint of the same blue on dark so it keeps contrast.
[theme.light]
primaryColor = "#1F4E79"

[theme.dark]
primaryColor = "#8DB3DA"

[server]
headless = true

[browser]
gatherUsageStats = false
